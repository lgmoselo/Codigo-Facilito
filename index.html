<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taller Don Ramiro — Control Operativo y Aprobación Bilateral</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .font-display {
      font-family: 'Barlow Condensed', sans-serif;
    }

    .font-mono-tabular {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    @keyframes pulse-border {

      0%,
      100% {
        border-color: #dc2626;
      }

      50% {
        border-color: #f59e0b;
      }
    }

    .paused-pulse {
      animation: pulse-border 2s infinite;
    }
  </style>
</head>

<body id="body-theme"
  class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-amber-500 selection:text-slate-950 transition-colors">

  <!-- BARRA SUPERIOR FIJA: SIMULADOR DE ROLES -->
  <header class="sticky top-0 z-50 bg-slate-950/95 backdrop-blur border-b border-slate-800 text-white">
    <div class="max-w-[1440px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span
          class="bg-amber-500 text-slate-950 font-display font-extrabold px-3 py-1 rounded-lg text-xl tracking-wide">
          <i class="fa-solid fa-wrench mr-1"></i>TALLER DON RAMIRO
        </span>
        <span class="text-xs text-slate-400 hidden md:inline">SDD v2.0 · Sincronización en Tiempo Real</span>
      </div>
      <nav aria-label="Simulador de Roles"
        class="flex items-center gap-1.5 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
        <button onclick="switchRole('mecanico')" id="tab-mecanico"
          class="px-4 py-2.5 rounded-lg text-sm font-bold transition cursor-pointer">👷 Vista Mecánico</button>
        <button onclick="switchRole('cliente')" id="tab-cliente"
          class="px-4 py-2.5 rounded-lg text-sm font-bold transition cursor-pointer">📱 Vista Cliente</button>
        <button onclick="switchRole('ramiro')" id="tab-ramiro"
          class="px-4 py-2.5 rounded-lg text-sm font-bold transition cursor-pointer">👨‍💼 Vista Don Ramiro</button>
      </nav>
      <button onclick="resetDemo()"
        class="px-3.5 py-2 text-xs font-semibold text-slate-300 hover:text-white bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg transition cursor-pointer">
        <i class="fa-solid fa-rotate-left mr-1"></i> Reiniciar Demo
      </button>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main id="app-root" class="max-w-[1440px] mx-auto px-4 sm:px-6 py-6"></main>

  <!-- MODAL DE IMPREVISTOS (CA-03) -->
  <div id="modal-imprevisto"
    class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm hidden items-center justify-center p-4 overflow-y-auto text-slate-100">
    <div class="bg-slate-900 border-2 border-amber-500 rounded-2xl max-w-2xl w-full shadow-2xl overflow-hidden my-auto">
      <div class="bg-amber-500 text-slate-950 px-6 py-4 flex items-center justify-between">
        <h2 class="font-display text-2xl font-extrabold uppercase"><i
            class="fa-solid fa-triangle-exclamation mr-2"></i>Reportar Imprevisto Mecánico</h2>
        <button onclick="closeImprevistoModal()"
          class="w-10 h-10 rounded-lg bg-slate-950/15 font-black text-xl">&times;</button>
      </div>
      <div class="p-6 space-y-5">
        <input type="hidden" id="imp-veh-id" />
        <div>
          <label class="block text-xs font-extrabold uppercase text-slate-300 mb-2">1. Fotografía de la Pieza Dañada
            (Cámara Móvil / Previsualización Instantánea) *</label>
          <input type="file" accept="image/*" capture="environment" onchange="previewImpFile(event)"
            class="text-xs text-slate-300 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:bg-slate-800 file:text-amber-400 file:font-bold cursor-pointer" />
          <img id="imp-preview-img" src="" alt="Previsualización"
            class="mt-3 w-full h-44 object-cover rounded-xl border border-slate-700" />
        </div>
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-extrabold uppercase text-slate-300">2. Descripción de la Falla (Voz o Texto)
              *</label>
            <button type="button" onclick="dictateText('imp-desc')"
              class="min-h-[56px] px-4 py-2 rounded-xl bg-red-950 hover:bg-red-900 border border-red-700 text-red-200 text-xs font-extrabold">
              <i class="fa-solid fa-microphone mr-1"></i> Dictar por Voz
            </button>
          </div>
          <textarea id="imp-desc" rows="2"
            class="w-full rounded-xl bg-slate-950 border border-slate-700 p-3 text-sm text-white"
            placeholder="Describa el daño detectado o use el botón de voz..."></textarea>
        </div>
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-extrabold uppercase text-slate-300">3. Costo Adicional ($ USD) *</label>
            <button type="button" onclick="setImpAmount(0)" class="text-xs text-slate-400 hover:text-white">Reiniciar a
              $0</button>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <button type="button" onclick="addImpAmount(10)"
              class="min-h-[64px] rounded-xl bg-slate-950 hover:bg-slate-800 border-2 border-slate-700 text-white font-mono-tabular text-2xl font-extrabold">+$10</button>
            <button type="button" onclick="addImpAmount(20)"
              class="min-h-[64px] rounded-xl bg-slate-950 hover:bg-slate-800 border-2 border-slate-700 text-white font-mono-tabular text-2xl font-extrabold">+$20</button>
            <button type="button" onclick="addImpAmount(50)"
              class="min-h-[64px] rounded-xl bg-slate-950 hover:bg-slate-800 border-2 border-slate-700 text-white font-mono-tabular text-2xl font-extrabold">+$50</button>
            <button type="button" onclick="toggleOtroMonto()"
              class="min-h-[64px] rounded-xl bg-amber-500/20 border-2 border-amber-500 text-amber-300 font-bold text-xs">[
              🔢 Otro Monto ]</button>
          </div>
          <div id="imp-otro-wrapper" class="mt-3 hidden">
            <input type="number" id="imp-exact-input" min="1" step="0.5" oninput="setImpAmount(this.value)"
              placeholder="Escriba el monto exacto ($ USD)"
              class="w-full min-h-[60px] px-4 rounded-xl bg-slate-950 border-2 border-amber-500 text-2xl font-mono-tabular font-black text-white" />
          </div>
          <div class="mt-3 p-3.5 rounded-xl bg-slate-950 border border-slate-800 flex justify-between items-center">
            <span class="text-xs font-bold uppercase text-slate-400">Monto Adicional a Autorizar:</span>
            <span id="imp-total-label" class="font-mono-tabular text-2xl font-black text-amber-400">$0.00 USD</span>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
          <button type="button" onclick="closeImprevistoModal()"
            class="min-h-[64px] rounded-xl bg-slate-800 text-slate-200 font-bold">Cancelar</button>
          <button type="button" onclick="saveImprevisto()"
            class="sm:col-span-2 min-h-[64px] rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-lg">Enviar
            a Aprobación del Cliente</button>
        </div>
      </div>
    </div>
  </div>

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || JSON.parse(JSON.stringify(INITIAL_STATE));
    if (!state.mecanicos) state.mecanicos = JSON.parse(JSON.stringify(INITIAL_STATE.mecanicos));
    let activeRole = 'mecanico';
    let activeMecanico = 'Mecanico1';
    let selectedClientVehId = state.vehiculos[1]?.id || state.vehiculos[0]?.id || '';
    let currentImpAmount = 0;
    let currentImpFoto = INITIAL_STATE.vehiculos[1].imprevistos[0].fotoUrl;

    function getMechanicLabel(codigo) {
      const m = state.mecanicos.find(x => x.codigo === codigo);
      return m ? `${m.codigo} (${m.nombre} ${m.apellido})` : codigo;
    }

    function getStatusStyle(estado) {
      return ESTADOS_OFICIALES.find(e => e.id === estado) || ESTADOS_OFICIALES[0];
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }

    function resetDemo() {
      localStorage.removeItem(STORAGE_KEY);
      state = JSON.parse(JSON.stringify(INITIAL_STATE));
      selectedClientVehId = state.vehiculos[1]?.id || '';
      render();
    }

    function switchRole(role) {
      activeRole = role;
      render();
    }

    function changeStatus(vehId, nuevoEstado) {
      const v = state.vehiculos.find(x => x.id === vehId);
      if (!v) return;
      v.estado = nuevoEstado;
      save();
    }

    function saveMechanicsConfig(e) {
      e.preventDefault();
      state.mecanicos.forEach(m => {
        const nom = document.getElementById('nom-' + m.codigo).value.trim();
        const ape = document.getElementById('ape-' + m.codigo).value.trim();
        if (nom) m.nombre = nom;
        if (ape) m.apellido = ape;
      });
      save();
      alert('Nombres y apellidos de mecánicos actualizados correctamente.');
    }

    function dismissAlert(alertId) {
      const a = state.alertasRetorno.find(x => x.id === alertId);
      if (a) a.leido = true;
      save();
    }

    function dictateText(targetId) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const el = document.getElementById(targetId);
      if (!SR) {
        el.value = (el.value ? el.value + ' ' : '') + 'Desgaste severo detectado en bahía; requiere reemplazo de componente y ajuste.';
        return;
      }
      const rec = new SR();
      rec.lang = 'es-ES';
      rec.onresult = (e) => {
        const txt = e.results[0][0].transcript;
        el.value = (el.value ? el.value + ' ' : '') + txt;
      };
      rec.start();
    }

    function sendInitialDiag(vehId) {
      const desc = document.getElementById('diag-desc-' + vehId).value.trim();
      const monto = parseFloat(document.getElementById('diag-monto-' + vehId).value);
      if (!desc || !monto || monto <= 0) {
        alert('Complete el diagnóstico y un monto mayor a $0.');
        return;
      }
      const v = state.vehiculos.find(x => x.id === vehId);
      v.diagnostico = {
        id: 'DG-' + Date.now(),
        descripcion: desc,
        monto: monto,
        resolucion: 'PENDIENTE',
        createdAt: new Date().toLocaleString('es-ES', { hour12: false })
      };
      v.estado = '⏸️ Pausado: Esperando Aprobación';
      selectedClientVehId = vehId;
      save();
    }

    function openImprevistoModal(vehId) {
      document.getElementById('imp-veh-id').value = vehId;
      document.getElementById('imp-desc').value = 'Al desmontar mordaza se detectó disco de freno con surcos profundos fuera de tolerancia.';
      currentImpAmount = 0;
      document.getElementById('imp-total-label').textContent = '$0.00 USD';
      document.getElementById('imp-preview-img').src = currentImpFoto;
      const modal = document.getElementById('modal-imprevisto');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeImprevistoModal() {
      const modal = document.getElementById('modal-imprevisto');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function previewImpFile(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = (ev) => {
        currentImpFoto = ev.target.result;
        document.getElementById('imp-preview-img').src = currentImpFoto;
      };
      r.readAsDataURL(f);
    }

    function addImpAmount(val) {
      currentImpAmount += val;
      document.getElementById('imp-total-label').textContent = '$' + currentImpAmount.toFixed(2) + ' USD';
      document.getElementById('imp-exact-input').value = currentImpAmount;
    }

    function setImpAmount(val) {
      currentImpAmount = parseFloat(val) || 0;
      document.getElementById('imp-total-label').textContent = '$' + currentImpAmount.toFixed(2) + ' USD';
    }

    function toggleOtroMonto() {
      const w = document.getElementById('imp-otro-wrapper');
      w.classList.toggle('hidden');
      document.getElementById('imp-exact-input').focus();
    }

    function saveImprevisto() {
      const vehId = document.getElementById('imp-veh-id').value;
      const desc = document.getElementById('imp-desc').value.trim();
      if (!desc || currentImpAmount <= 0) {
        alert('Ingrese descripción y un monto mayor a $0.');
        return;
      }
      const v = state.vehiculos.find(x => x.id === vehId);
      v.imprevistos.push({
        id: 'IMP-' + Date.now(),
        descripcion: desc,
        monto: currentImpAmount,
        fotoUrl: currentImpFoto,
        fotoLabel: 'Evidencia de Bahía',
        resolucion: 'PENDIENTE',
        createdAt: new Date().toLocaleString('es-ES', { hour12: false })
      });
      v.estado = '⏸️ Pausado: Esperando Aprobación';
      selectedClientVehId = vehId;
      closeImprevistoModal();
      save();
    }

    function registerNewVehicle(e) {
      e.preventDefault();
      const cliente = document.getElementById('reg-cliente').value.trim();
      const telefono = document.getElementById('reg-telefono').value.replace(/[^0-9]/g, '');
      const email = document.getElementById('reg-email').value.trim();
      const modelo = document.getElementById('reg-modelo').value.trim();
      const placa = document.getElementById('reg-placa').value.trim().toUpperCase();
      const mecanico = document.getElementById('reg-mecanico').value;

      if (!cliente || telefono.length < 8 || !email.includes('@') || !modelo || !placa) {
        alert('CA-01: Todos los campos, incluyendo Teléfono (WhatsApp) y Correo Electrónico válidos, son obligatorios.');
        return;
      }

      state.vehiculos.unshift({
        id: 'VEH-' + Math.floor(100 + Math.random() * 900),
        cliente, telefono, email, modelo, placa, mecanico,
        estado: '🔍 En Diagnóstico',
        fechaIngreso: new Date().toLocaleString('es-ES', { hour12: false }),
        diagnostico: null,
        imprevistos: []
      });
      save();
    }

    function clientDecision(vehId, itemId, tipo, aprobado) {
      const v = state.vehiculos.find(x => x.id === vehId);
      const chk = document.getElementById('chk-' + itemId);
      const firma = document.getElementById('firma-' + itemId).value.trim();
      if (!chk.checked || firma.length < 3) {
        alert('CA-04: Marque la casilla "Acepto el presupuesto descrito" e ingrese su Firma Digital (Nombre o últimos 4 dígitos).');
        return;
      }
      const cmpId = 'CMP-' + Math.floor(100000 + Math.random() * 900000);
      const now = new Date().toLocaleString('es-ES', { hour12: false });
      const resLabel = aprobado ? 'APROBADO' : 'RECHAZADO';
      let monto = 0;
      let desc = '';

      if (tipo === 'Diagnóstico Inicial') {
        v.diagnostico.resolucion = resLabel;
        v.diagnostico.comprobanteId = cmpId;
        v.diagnostico.firma = firma;
        v.diagnostico.resolvedAt = now;
        monto = v.diagnostico.monto;
        desc = v.diagnostico.descripcion;
      } else {
        const imp = v.imprevistos.find(x => x.id === itemId);
        imp.resolucion = resLabel;
        imp.comprobanteId = cmpId;
        imp.firma = firma;
        imp.resolvedAt = now;
        monto = imp.monto;
        desc = imp.descripcion;
      }

      if (aprobado) v.estado = '🔧 En Reparación';

      const receipt = Object.freeze({
        comprobanteId: cmpId,
        timestamp: now,
        vehiculoId: v.id,
        placa: v.placa,
        modelo: v.modelo,
        cliente: v.cliente,
        mecanico: v.mecanico,
        tipo: tipo,
        itemId: itemId,
        descripcion: desc,
        monto: monto,
        firma: firma,
        decision: resLabel
      });
      state.auditoria.unshift(receipt);

      // CA-04: Emitir Alerta de Retorno del Cliente hacia el Taller
      state.alertasRetorno.unshift({
        id: 'ALT-' + Date.now(),
        timestamp: now,
        placa: v.placa,
        modelo: v.modelo,
        cliente: v.cliente,
        mecanico: v.mecanico,
        tipo: tipo,
        monto: monto,
        decision: resLabel,
        comprobanteId: cmpId,
        firma: firma,
        leido: false
      });

      save();
    }

    function renderAlertsBanner() {
      const unread = state.alertasRetorno.filter(a => !a.leido);
      if (unread.length === 0) return '';
      return '<div class="space-y-2 mb-6">' + unread.map(a => `
        <div class="bg-emerald-600 text-white px-5 py-3.5 rounded-2xl shadow-lg flex flex-wrap items-center justify-between gap-3">
          <div class="text-sm font-bold">
            <i class="fa-solid fa-bell mr-2"></i>NOTIFICACIÓN DE RETORNO DEL CLIENTE (CA-04):
            <strong>${a.cliente}</strong> (${a.placa} · ${a.modelo}) ha <strong>${a.decision}</strong> el ${a.tipo} por
            <span class="font-mono-tabular underline">$${a.monto.toFixed(2)} USD</span> · Firma: <em>${a.firma}</em> · ID: <span class="font-mono-tabular">${a.comprobanteId}</span>
          </div>
          <button onclick="dismissAlert('${a.id}')" class="px-3 py-1 rounded-lg bg-slate-950/25 hover:bg-slate-950/40 text-xs font-extrabold">Entendido ✕</button>

        '<div class="md:col-span-2"><h2 class="font-display text-2xl font-extrabold uppercase text-slate-900">+ Ingresar Nuevo Vehículo · Contacto Dual Obligatorio (CA-01)</h2></div>' +
        '<input id="reg-cliente" placeholder="Nombre del Cliente *" class="min-h-[48px] px-3.5 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm" />' +
        '<input id="reg-telefono" placeholder="Teléfono WhatsApp (Ej: 584121234567) *" class="min-h-[48px] px-3.5 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm" />' +
        '<input id="reg-email" type="email" placeholder="Correo Electrónico *" class="min-h-[48px] px-3.5 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm" />' +
        '<input id="reg-modelo" placeholder="Marca y Modelo *" class="min-h-[48px] px-3.5 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm" />' +
        '<input id="reg-placa" placeholder="Placa *" class="min-h-[48px] px-3.5 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm uppercase font-mono-tabular" />' +
        '<select id="reg-mecanico" class="min-h-[48px] px-3.5 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm font-semibold">' +
        state.mecanicos.map(m => `<option value="${m.codigo}">${m.codigo} — ${m.nombre} ${m.apellido}</option>`).join('') +
        '</select>' +
        '<div class="md:col-span-2 flex justify-end"><button type="submit" class="min-h-[52px] px-6 rounded-xl bg-blue-800 hover:bg-blue-900 text-white font-extrabold text-sm">+ Registrar Vehículo e Iniciar Diagnóstico</button></div>' +
        '</form>' +
        '</div>' +

        '<div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">' +
        '<h2 class="font-display text-2xl font-extrabold uppercase text-slate-900 mb-4">Tabla de Auditoría Digital Inmutable (CA-05)</h2>' +
        '<div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="border-y border-slate-200 bg-slate-50 text-xs uppercase text-slate-600"><tr><th class="py-3 px-4">ID Comprobante</th><th class="py-3 px-4">Fecha/Hora</th><th class="py-3 px-4">Placa / Vehículo</th><th class="py-3 px-4">Mecánico</th><th class="py-3 px-4">Tipo</th><th class="py-3 px-4">Monto</th><th class="py-3 px-4">Firma</th><th class="py-3 px-4">Resolución</th></tr></thead><tbody class="divide-y divide-slate-200">' +
        state.auditoria.map(a => '<tr><td class="py-3 px-4 font-mono-tabular text-blue-800 font-bold">' + a.comprobanteId + '</td><td class="py-3 px-4 text-xs text-slate-600">' + a.timestamp + '</td><td class="py-3 px-4 font-bold text-slate-900">' + a.placa + ' · ' + a.modelo + '</td><td class="py-3 px-4 text-xs">' + getMechanicLabel(a.mecanico) + '</td><td class="py-3 px-4 font-semibold">' + a.tipo + '</td><td class="py-3 px-4 font-mono-tabular font-black">$' + a.monto.toFixed(2) + '</td><td class="py-3 px-4 font-mono-tabular text-emerald-700 font-bold">' + a.firma + '</td><td class="py-3 px-4 font-extrabold"><span class="px-2.5 py-1 rounded-full text-xs ' + (a.decision === 'APROBADO' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800') + '">' + a.decision + '</span></td></tr>').join('') +
        '</tbody></table></div>' +
        '</div>' +
        '</div>';
    }

    render();
  </script>
</body>

</html>
